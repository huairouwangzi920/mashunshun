<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马顺顺 - 户外摄影师</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hero -->
    <section id="hero">
        <canvas id="hero-canvas"></canvas>
        <div class="hero-overlay revealed">
            <h1 class="hero-name">马顺顺</h1>
            <p class="hero-tagline">户外摄影 · 山野行者</p>
        </div>
        <div class="scroll-hint">
            <span class="scroll-arrow"></span>
        </div>
    </section>

    <!-- Gallery -->
    <section id="gallery">
        <div class="gallery-item">
            <div class="gallery-image">
                <canvas id="photo-0" width="800" height="533"></canvas>
            </div>
            <div class="gallery-info">
                <span class="gallery-num">01</span>
                <h3>雪山与湖泊</h3>
                <p>在海拔四千五百米的垭口，等待第一缕光照亮雪峰。</p>
            </div>
        </div>
        <div class="gallery-item reverse">
            <div class="gallery-image">
                <canvas id="photo-1" width="800" height="533"></canvas>
            </div>
            <div class="gallery-info">
                <span class="gallery-num">02</span>
                <h3>森林与晨雾</h3>
                <p>雾气漫过冷杉林，每一步都踩在云层之上。</p>
            </div>
        </div>
        <div class="gallery-item">
            <div class="gallery-image">
                <canvas id="photo-2" width="800" height="533"></canvas>
            </div>
            <div class="gallery-info">
                <span class="gallery-num">03</span>
                <h3>沙漠与星河</h3>
                <p>沙丘的曲线是风写给大地的诗，银河是夜的注脚。</p>
            </div>
        </div>
    </section>

    <!-- Brands -->
    <section id="brands">
        <h2 class="section-label">合作品牌</h2>
        <div class="danmaku-container">
            <div class="danmaku-track track-1"></div>
            <div class="danmaku-track track-2"></div>
            <div class="danmaku-track track-3"></div>
            <div class="danmaku-track track-4"></div>
        </div>
    </section>

    <!-- Slogan -->
    <section id="slogan">
        <h2 class="slogan-main">山脊之上，光影之间</h2>
        <p class="slogan-sub">马顺顺 &nbsp;·&nbsp; 用镜头对话荒野</p>
        <footer class="site-footer">
            <span>&copy; 2026 马顺顺</span>
        </footer>
    </section>

    <script src="script.js"></script>
</body>
</html>
